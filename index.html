<h1>Student Information System</h1>

<input id="studentNumber" placeholder="Student Number">
<input id= "fullName" placeholder="Full Name">
<input id= "course" placeholder="Course">
<input id= "email" placeholder="Email">

<button onclick="addStudent()">
    Save Student
</button>

<div id="studentList"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://pevtiffhphyakpiuwamk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_MJutYniEI_u3Y913tRjJaA_t9heU8FV";
    const db = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
);
async function addStudent(){
    const record={
        student_number: studentNumber.value,
        full_name: fullName.value,
        course: course.value,
        email: email.value
    };
  
    const { error } = await db
        .from("student")
        .insert(record);
  
    if ( error ){
        alert(error.message);
        return;
    }

    alert("Student saved!");
    loadStudent();
  }

    async function loadStudent() {
     const {data, error} = await db
        .from("student")
        .select("*")
        .order("id", {ascending: false});

    if (error) {
        studentList.innerHTML = error.message;
        return;
    }  

    studentList.innerHTML= data.map(s =>
        `<p><b>${s.full_name}</b><br>
        ${s.student_number} | ${s.course}</p>`
        ).join("");
    
    }

    loadStudent();
</script>
